<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="A derby wheel, a polished axle and a close-up of the polished wheel bore">
  <defs>
    <linearGradient id="wlBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1e6d4"/>
      <stop offset="1" stop-color="#dcc6a4"/>
    </linearGradient>
    <radialGradient id="wlFace" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#4a403a"/>
      <stop offset="0.65" stop-color="#2e2723"/>
      <stop offset="1" stop-color="#171310"/>
    </radialGradient>
    <linearGradient id="wlMetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f7a82"/>
      <stop offset="0.25" stop-color="#d8e0e4"/>
      <stop offset="0.55" stop-color="#9aa5ac"/>
      <stop offset="0.82" stop-color="#eef4f6"/>
      <stop offset="1" stop-color="#7c878e"/>
    </linearGradient>
    <radialGradient id="wlGlass" cx="0.4" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#fbf7ee" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e2d2b7" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#wlBg)"/>
  <g stroke="#c7ab84" stroke-width="2" opacity="0.5" fill="none">
    <path d="M 0 96 C 240 88 440 104 660 96 C 880 88 1050 102 1200 94"/>
    <path d="M 0 812 C 220 804 420 820 640 812 C 860 804 1040 818 1200 810"/>
  </g>
  <ellipse cx="400" cy="700" rx="290" ry="36" fill="#b3906a" opacity="0.4"/>
  <ellipse cx="1020" cy="786" rx="170" ry="24" fill="#b3906a" opacity="0.35"/>

  <!-- wheel -->
  <g transform="translate(392 462)">
    <circle r="232" fill="#b99a72" opacity="0.35"/>
    <circle r="222" fill="#171310"/>
    <circle r="212" fill="#241d19"/>
    <circle r="206" fill="none" stroke="#0d0b0a" stroke-width="12" stroke-dasharray="5 12"/>
    <circle r="188" fill="url(#wlFace)"/>
    <circle r="188" fill="none" stroke="#0f0c0b" stroke-width="3" opacity="0.8"/>
    <circle r="150" fill="none" stroke="#0f0c0b" stroke-width="3" opacity="0.55"/>
    <circle r="112" fill="#332b26"/>
    <!-- hub -->
    <circle r="56" fill="#241e1a" stroke="#100d0c" stroke-width="3"/>
    <circle r="24" fill="#0d0b0a"/>
    <circle r="24" fill="none" stroke="#5c524a" stroke-width="2" opacity="0.7"/>
    <!-- specular rim light -->
    <path d="M -196 -84 A 214 214 0 0 1 -84 -196" fill="none" stroke="#e9b45f" stroke-width="6" opacity="0.45" stroke-linecap="round"/>
    <path d="M -128 -150 A 196 196 0 0 1 -34 -198" fill="none" stroke="#f7f1e6" stroke-width="3" opacity="0.28" stroke-linecap="round"/>
    <!-- bore glint -->
    <circle cx="-8" cy="-8" r="6" fill="#f7f1e6" opacity="0.4"/>
  </g>

  <!-- axle -->
  <g transform="translate(722 250) rotate(-24)">
    <rect x="-14" y="0" width="34" height="250" rx="8" fill="url(#wlMetal)"/>
    <path d="M -60 4 C -60 -30 -30 -44 4 -44 C 36 -44 62 -30 62 4 C 62 34 34 44 4 44 C -28 44 -60 34 -60 4 Z" fill="url(#wlMetal)" stroke="#5f6a70" stroke-width="3"/>
    <ellipse cx="2" cy="0" rx="30" ry="26" fill="none" stroke="#5f6a70" stroke-width="2.5" opacity="0.6"/>
    <path d="M -34 -18 C -20 -32 12 -34 34 -20" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.55"/>
    <path d="M -2 40 L -2 246" stroke="#ffffff" stroke-width="3" opacity="0.4"/>
    <!-- crimp marks being filed away -->
    <g stroke="#4f5a60" stroke-width="3" opacity="0.5">
      <path d="M 2 92 H 22"/>
      <path d="M 2 108 H 22"/>
      <path d="M 2 124 H 22"/>
    </g>
  </g>

  <!-- polish sparkles -->
  <g stroke="#f7f1e6" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <path d="M 700 214 L 700 190"/>
    <path d="M 688 202 L 712 202"/>
    <path d="M 902 138 L 902 118"/>
    <path d="M 892 128 L 912 128"/>
  </g>

  <!-- magnifier detail of the bore -->
  <g transform="translate(1000 636)">
    <circle r="150" fill="url(#wlGlass)" stroke="#3c322b" stroke-width="10"/>
    <circle r="150" fill="none" stroke="#6d5d50" stroke-width="3" opacity="0.6"/>
    <g transform="translate(-4 0)">
      <circle r="86" fill="#2a2320"/>
      <circle r="86" fill="none" stroke="#b8c2c7" stroke-width="7" opacity="0.9"/>
      <circle r="86" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
      <circle r="46" fill="#0d0b0a"/>
      <circle r="46" fill="none" stroke="#98a3a9" stroke-width="4" opacity="0.85"/>
      <path d="M -72 -40 A 82 82 0 0 1 -20 -80" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.4"/>
      <path d="M -58 44 A 72 72 0 0 0 10 78" fill="none" stroke="#dfe7ea" stroke-width="2" opacity="0.35"/>
    </g>
    <!-- graphite specks -->
    <g fill="#4b4a45">
      <circle cx="58" cy="-92" r="3"/>
      <circle cx="96" cy="-46" r="2.4"/>
      <circle cx="-104" cy="-60" r="2.6"/>
      <circle cx="-78" cy="96" r="2.2"/>
      <circle cx="76" cy="86" r="2.8"/>
    </g>
    <!-- hairline scratches -->
    <g stroke="#efe6d5" stroke-width="1.6" opacity="0.6">
      <path d="M -30 -110 L 24 -104"/>
      <path d="M -96 -20 L -60 6"/>
    </g>
    <rect x="96" y="96" width="26" height="130" rx="12" transform="rotate(-40 96 96)" fill="#3c322b"/>
  </g>

  <!-- leader marks -->
  <g stroke="#a5160f" stroke-width="2.5" fill="none" opacity="0.7">
    <path d="M 236 300 L 168 236"/>
    <path d="M 700 470 L 770 528"/>
  </g>
  <g fill="#a5160f">
    <circle cx="236" cy="300" r="8"/>
    <circle cx="700" cy="470" r="8"/>
    <circle cx="852" cy="340" r="8"/>
  </g>
  <g stroke="#a5160f" stroke-width="2.5" fill="none" opacity="0.7">
    <path d="M 852 340 L 900 400"/>
  </g>

  <!-- spare wheels -->
  <g transform="translate(722 760)">
    <circle r="62" fill="#171310"/>
    <circle r="52" fill="#2b2420"/>
    <circle r="22" fill="#0d0b0a"/>
    <circle cx="128" r="54" fill="#171310"/>
    <circle cx="128" r="44" fill="#2b2420"/>
    <circle cx="128" r="19" fill="#0d0b0a"/>
    <path d="M -40 -46 A 60 60 0 0 1 -8 -60" fill="none" stroke="#e9b45f" stroke-width="4" opacity="0.4"/>
  </g>
</svg>
