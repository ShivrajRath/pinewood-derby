<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="A derby wheel, a polished axle and a close-up of the polished wheel bore">
  <defs>
    <linearGradient id="wlBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1e6d4"/>
      <stop offset="1" stop-color="#dcc6a4"/>
    </linearGradient>
    <radialGradient id="wlFace" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#4a403a"/>
      <stop offset="0.65" stop-color="#2e2723"/>
      <stop offset="1" stop-color="#171310"/>
    </radialGradient>
    <linearGradient id="wlMetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f7a82"/>
      <stop offset="0.25" stop-color="#d8e0e4"/>
      <stop offset="0.55" stop-color="#9aa5ac"/>
      <stop offset="0.82" stop-color="#eef4f6"/>
      <stop offset="1" stop-color="#7c878e"/>
    </linearGradient>
    <radialGradient id="wlGlass" cx="0.4" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#fbf7ee" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#e2d2b7" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#wlBg)"/>
  <g stroke="#c7ab84" stroke-width="2" opacity="0.45" fill="none">
    <path d="M 0 96 C 240 88 440 104 660 96 C 880 88 1050 102 1200 94"/>
    <path d="M 0 830 C 220 822 420 838 640 830 C 860 822 1040 836 1200 828"/>
  </g>
  <ellipse cx="356" cy="710" rx="250" ry="30" fill="#b3906a" opacity="0.4"/>
  <ellipse cx="1000" cy="800" rx="190" ry="24" fill="#b3906a" opacity="0.3"/>

  <!-- wheel -->
  <g transform="translate(356 456)">
    <circle r="226" fill="#b99a72" opacity="0.32"/>
    <circle r="214" fill="#171310"/>
    <circle r="204" fill="#241d19"/>
    <circle r="198" fill="none" stroke="#0d0b0a" stroke-width="12" stroke-dasharray="5 12"/>
    <circle r="180" fill="url(#wlFace)"/>
    <circle r="180" fill="none" stroke="#0f0c0b" stroke-width="3" opacity="0.8"/>
    <circle r="142" fill="none" stroke="#0f0c0b" stroke-width="3" opacity="0.5"/>
    <circle r="104" fill="#332b26"/>
    <circle r="52" fill="#241e1a" stroke="#100d0c" stroke-width="3"/>
    <circle r="23" fill="#0d0b0a"/>
    <circle r="23" fill="none" stroke="#5c524a" stroke-width="2" opacity="0.7"/>
    <path d="M -190 -80 A 206 206 0 0 1 -80 -190" fill="none" stroke="#e9b45f" stroke-width="6" opacity="0.4" stroke-linecap="round"/>
    <path d="M -120 -144 A 186 186 0 0 1 -30 -190" fill="none" stroke="#f7f1e6" stroke-width="3" opacity="0.25" stroke-linecap="round"/>
  </g>

  <!-- axle -->
  <g transform="translate(742 330) rotate(-26)">
    <rect x="-12" y="-152" width="24" height="228" rx="6" fill="url(#wlMetal)" stroke="#5f6a70" stroke-width="2"/>
    <path d="M -12 76 L 0 122 L 12 76 Z" fill="url(#wlMetal)" stroke="#5f6a70" stroke-width="2"/>
    <ellipse cx="0" cy="-152" rx="46" ry="34" fill="url(#wlMetal)" stroke="#5f6a70" stroke-width="3"/>
    <ellipse cx="0" cy="-152" rx="24" ry="17" fill="none" stroke="#5f6a70" stroke-width="2.5" opacity="0.7"/>
    <path d="M -20 -168 C -6 -180 18 -180 32 -166" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.6"/>
    <path d="M -2 -120 L -2 40" stroke="#ffffff" stroke-width="3" opacity="0.45"/>
    <!-- crimp marks under the head -->
    <g stroke="#4f5a60" stroke-width="3" opacity="0.55">
      <path d="M 6 -108 H 18"/>
      <path d="M 6 -94 H 18"/>
      <path d="M 6 -80 H 18"/>
    </g>
  </g>

  <!-- polish sparkles -->
  <g stroke="#f7f1e6" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M 664 206 L 664 184"/>
    <path d="M 653 195 L 675 195"/>
    <path d="M 902 218 L 902 198"/>
    <path d="M 892 208 L 912 208"/>
  </g>

  <!-- magnifier -->
  <g transform="translate(996 618)">
    <rect x="96" y="96" width="26" height="128" rx="12" transform="rotate(-40 96 96)" fill="#3c322b"/>
    <circle r="146" fill="url(#wlGlass)" stroke="#3c322b" stroke-width="10"/>
    <circle r="146" fill="none" stroke="#6d5d50" stroke-width="3" opacity="0.6"/>
    <g transform="translate(-4 0)">
      <circle r="84" fill="#2a2320"/>
      <circle r="84" fill="none" stroke="#b8c2c7" stroke-width="7" opacity="0.9"/>
      <circle r="84" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
      <circle r="44" fill="#0d0b0a"/>
      <circle r="44" fill="none" stroke="#98a3a9" stroke-width="4" opacity="0.85"/>
      <path d="M -70 -38 A 80 80 0 0 1 -18 -78" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.4"/>
      <path d="M -56 42 A 70 70 0 0 0 10 76" fill="none" stroke="#dfe7ea" stroke-width="2" opacity="0.35"/>
    </g>
    <g fill="#4b4a45">
      <circle cx="56" cy="-90" r="3"/>
      <circle cx="92" cy="-44" r="2.4"/>
      <circle cx="-100" cy="-58" r="2.6"/>
      <circle cx="-74" cy="92" r="2.2"/>
      <circle cx="72" cy="84" r="2.8"/>
    </g>
    <g stroke="#efe6d5" stroke-width="1.6" opacity="0.55">
      <path d="M -28 -106 L 22 -100"/>
      <path d="M -92 -18 L -58 6"/>
    </g>
  </g>

  <!-- labelled callouts -->
  <g font-family="Barlow Condensed, Arial Narrow, sans-serif" font-size="21" letter-spacing="3" fill="#8a3a32">
    <text x="90" y="196">TREAD SEAM</text>
    <text x="828" y="300">AXLE CRIMP</text>
    <text x="990" y="404">BORE</text>
  </g>
  <g stroke="#a5160f" stroke-width="2.5" fill="none" opacity="0.65">
    <path d="M 214 208 L 268 262"/>
    <path d="M 900 312 L 846 340"/>
    <path d="M 1000 416 L 986 484"/>
  </g>
  <g fill="#a5160f">
    <circle cx="268" cy="262" r="6"/>
    <circle cx="846" cy="340" r="6"/>
    <circle cx="986" cy="484" r="6"/>
  </g>

  <!-- spare wheels -->
  <g transform="translate(742 776)">
    <ellipse cx="4" cy="66" rx="120" ry="16" fill="#b3906a" opacity="0.35"/>
    <circle r="58" fill="#171310"/>
    <circle r="49" fill="#2b2420"/>
    <circle r="30" fill="#332b26"/>
    <circle r="13" fill="#0d0b0a"/>
    <circle cx="128" r="58" fill="#171310"/>
    <circle cx="128" r="49" fill="#2b2420"/>
    <circle cx="128" r="30" fill="#332b26"/>
    <circle cx="128" r="13" fill="#0d0b0a"/>
    <path d="M -38 -44 A 56 56 0 0 1 -8 -57" fill="none" stroke="#e9b45f" stroke-width="4" opacity="0.4"/>
    <path d="M 92 -44 A 56 56 0 0 1 122 -57" fill="none" stroke="#e9b45f" stroke-width="4" opacity="0.4"/>
  </g>
</svg>
