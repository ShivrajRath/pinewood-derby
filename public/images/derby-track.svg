<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="A three-lane pinewood derby track running from the start gate to the checkered finish line">
  <defs>
    <linearGradient id="trkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171310"/>
      <stop offset="0.6" stop-color="#221a15"/>
      <stop offset="1" stop-color="#120e0c"/>
    </linearGradient>
    <linearGradient id="trkLane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6039"/>
      <stop offset="0.55" stop-color="#6a4828"/>
      <stop offset="1" stop-color="#412b18"/>
    </linearGradient>
    <linearGradient id="trkRail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9b45f"/>
      <stop offset="1" stop-color="#a97c30"/>
    </linearGradient>
    <pattern id="trkChecker" width="34" height="34" patternUnits="userSpaceOnUse">
      <rect width="34" height="34" fill="#f7f1e6"/>
      <rect width="17" height="17" fill="#131010"/>
      <rect x="17" y="17" width="17" height="17" fill="#131010"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#trkBg)"/>
  <ellipse cx="860" cy="400" rx="760" ry="380" fill="#e9b45f" opacity="0.05"/>

  <!-- track deck -->
  <path d="M 0 300 L 1600 470 L 1600 850 L 0 760 Z" fill="url(#trkLane)"/>
  <path d="M 0 300 L 1600 470" stroke="#c9a273" stroke-width="4" opacity="0.4"/>
  <path d="M 0 760 L 1600 850" stroke="#2a1b11" stroke-width="10" opacity="0.85"/>

  <!-- lane guide rails -->
  <g stroke-width="16" opacity="0.85">
    <path d="M 0 402 L 1600 548" stroke="#2a1c12"/>
    <path d="M 0 522 L 1600 646" stroke="#2a1c12"/>
    <path d="M 0 640 L 1600 744" stroke="#2a1c12"/>
  </g>
  <g stroke-width="4" opacity="0.7">
    <path d="M 0 397 L 1600 543" stroke="url(#trkRail)"/>
    <path d="M 0 517 L 1600 641" stroke="url(#trkRail)"/>
    <path d="M 0 635 L 1600 739" stroke="url(#trkRail)"/>
  </g>

  <!-- deck seams -->
  <g stroke="#2e1e13" stroke-width="3" opacity="0.5">
    <path d="M 180 312 L 180 768"/>
    <path d="M 420 340 L 420 782"/>
    <path d="M 680 376 L 680 798"/>
    <path d="M 940 414 L 940 816"/>
    <path d="M 1200 446 L 1200 834"/>
    <path d="M 1420 462 L 1420 846"/>
  </g>

  <!-- start gate -->
  <g>
    <rect x="54" y="180" width="24" height="590" fill="#231a14"/>
    <rect x="54" y="180" width="24" height="12" fill="#e9b45f" opacity="0.6"/>
    <g transform="rotate(-6 60 350)">
      <rect x="70" y="330" width="180" height="26" rx="6" fill="#3a2a1e"/>
      <rect x="228" y="352" width="16" height="36" fill="#f7f1e6" opacity="0.8"/>
      <rect x="228" y="452" width="16" height="36" fill="#f7f1e6" opacity="0.8"/>
      <rect x="228" y="552" width="16" height="36" fill="#f7f1e6" opacity="0.8"/>
    </g>
  </g>

  <!-- racing cars, one per lane -->
  <g>
    <g transform="translate(430 330) rotate(4.5)">
      <path d="M 0 118 L 0 78 C 12 48 42 32 82 26 L 250 -2 C 286 -8 306 2 318 26 L 356 78 C 368 96 374 108 374 118 Z" fill="#a5160f"/>
      <path d="M 40 44 C 90 30 180 12 244 4" fill="none" stroke="#f7f1e6" stroke-width="6" opacity="0.7"/>
      <circle cx="58" cy="118" r="22" fill="#131010"/>
      <circle cx="318" cy="118" r="22" fill="#131010"/>
    </g>
    <g transform="translate(560 470) rotate(6.5)">
      <path d="M 0 118 L 0 78 C 12 48 42 32 82 26 L 250 -2 C 286 -8 306 2 318 26 L 356 78 C 368 96 374 108 374 118 Z" fill="#e9b45f"/>
      <path d="M 40 44 C 90 30 180 12 244 4" fill="none" stroke="#131010" stroke-width="6" opacity="0.5"/>
      <circle cx="58" cy="118" r="22" fill="#131010"/>
      <circle cx="318" cy="118" r="22" fill="#131010"/>
    </g>
    <g transform="translate(690 612) rotate(8)">
      <path d="M 0 118 L 0 78 C 12 48 42 32 82 26 L 250 -2 C 286 -8 306 2 318 26 L 356 78 C 368 96 374 108 374 118 Z" fill="#f7f1e6"/>
      <path d="M 40 44 C 90 30 180 12 244 4" fill="none" stroke="#a5160f" stroke-width="6" opacity="0.8"/>
      <circle cx="58" cy="118" r="22" fill="#131010"/>
      <circle cx="318" cy="118" r="22" fill="#131010"/>
    </g>
  </g>

  <!-- motion streaks -->
  <g fill="#f7f1e6" opacity="0.12">
    <path d="M 900 380 L 1230 428 L 1230 434 L 900 388 Z"/>
    <path d="M 980 512 L 1330 566 L 1330 572 L 980 520 Z"/>
    <path d="M 1040 650 L 1360 700 L 1360 706 L 1040 658 Z"/>
  </g>

  <!-- finish structure -->
  <g>
    <rect x="1360" y="246" width="20" height="590" fill="#241b14"/>
    <rect x="1548" y="258" width="20" height="600" fill="#241b14"/>
    <rect x="1338" y="222" width="244" height="30" fill="#1c1511"/>
    <rect x="1338" y="222" width="244" height="7" fill="url(#trkRail)" opacity="0.8"/>
    <rect x="1430" y="240" width="56" height="608" transform="rotate(-4.4 1458 540)" fill="url(#trkChecker)"/>
  </g>

  <path d="M 0 850 L 1600 900 L 0 900 Z" fill="#0b0908" opacity="0.7"/>
</svg>
