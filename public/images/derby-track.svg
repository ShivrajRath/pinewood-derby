<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="A three-lane pinewood derby track running from the start gate to the checkered finish line">
  <defs>
    <linearGradient id="trkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171310"/>
      <stop offset="0.6" stop-color="#221a15"/>
      <stop offset="1" stop-color="#120e0c"/>
    </linearGradient>
    <linearGradient id="trkLane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6039"/>
      <stop offset="0.55" stop-color="#6a4828"/>
      <stop offset="1" stop-color="#412b18"/>
    </linearGradient>
    <linearGradient id="trkRail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9b45f"/>
      <stop offset="1" stop-color="#a97c30"/>
    </linearGradient>
    <pattern id="trkChecker" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#f7f1e6"/>
      <rect width="15" height="15" fill="#131010"/>
      <rect x="15" y="15" width="15" height="15" fill="#131010"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#trkBg)"/>
  <ellipse cx="900" cy="380" rx="720" ry="380" fill="#e9b45f" opacity="0.06"/>

  <!-- track deck -->
  <path d="M 0 300 L 1600 456 L 1600 812 L 0 700 Z" fill="url(#trkLane)"/>
  <path d="M 0 300 L 1600 456" stroke="#c9a273" stroke-width="4" opacity="0.45"/>
  <path d="M 0 700 L 1600 812" stroke="#2a1b11" stroke-width="8" opacity="0.8"/>

  <!-- lane dividers / guide rails -->
  <g stroke-width="14" opacity="0.85">
    <path d="M 0 396 L 1600 528" stroke="#2a1c12"/>
    <path d="M 0 512 L 1600 622" stroke="#2a1c12"/>
    <path d="M 0 620 L 1600 714" stroke="#2a1c12"/>
  </g>
  <g stroke-width="5" opacity="0.75">
    <path d="M 0 392 L 1600 524" stroke="url(#trkRail)"/>
    <path d="M 0 508 L 1600 618" stroke="url(#trkRail)"/>
    <path d="M 0 616 L 1600 710" stroke="url(#trkRail)"/>
  </g>

  <!-- deck seams -->
  <g stroke="#2e1e13" stroke-width="3" opacity="0.55">
    <path d="M 140 292 L 140 706"/>
    <path d="M 320 320 L 320 713"/>
    <path d="M 520 350 L 520 722"/>
    <path d="M 740 384 L 740 733"/>
    <path d="M 980 416 L 980 746"/>
    <path d="M 1220 438 L 1220 758"/>
    <path d="M 1440 454 L 1440 776"/>
  </g>

  <!-- start gate -->
  <g>
    <rect x="46" y="150" width="26" height="560" fill="#231a14"/>
    <rect x="46" y="150" width="26" height="14" fill="#e9b45f" opacity="0.7"/>
    <rect x="60" y="330" width="150" height="24" rx="6" fill="#3a2a1e" transform="rotate(-4 60 330)"/>
    <g fill="#f7f1e6" opacity="0.85">
      <rect x="196" y="352" width="14" height="26" transform="rotate(-4 196 352)"/>
      <rect x="196" y="440" width="14" height="26" transform="rotate(-4 196 440)"/>
      <rect x="196" y="528" width="14" height="26" transform="rotate(-4 196 528)"/>
    </g>
  </g>

  <!-- cars in the lanes -->
  <g fill="#a5160f">
    <path d="M 292 462 L 292 430 C 300 408 320 396 346 392 L 448 372 C 470 368 484 374 494 388 L 524 424 C 534 436 538 448 538 462 Z"/>
  </g>
  <g fill="#e9b45f">
    <path d="M 336 574 L 336 544 C 344 522 364 510 390 506 L 492 486 C 514 482 528 488 538 502 L 568 538 C 578 550 582 562 582 574 Z"/>
  </g>
  <g fill="#f7f1e6">
    <path d="M 386 682 L 386 652 C 394 630 414 618 440 614 L 542 594 C 564 590 578 596 588 610 L 618 646 C 628 658 632 670 632 682 Z"/>
  </g>
  <g fill="#131010" opacity="0.85">
    <circle cx="322" cy="462" r="15"/>
    <circle cx="506" cy="462" r="15"/>
    <circle cx="366" cy="574" r="15"/>
    <circle cx="550" cy="574" r="15"/>
    <circle cx="416" cy="682" r="15"/>
    <circle cx="600" cy="682" r="15"/>
  </g>

  <!-- motion streaks -->
  <g fill="#f7f1e6" opacity="0.14">
    <rect x="620" y="416" width="240" height="4"/>
    <rect x="700" y="470" width="300" height="4"/>
    <rect x="660" y="530" width="260" height="4"/>
    <rect x="760" y="590" width="300" height="4"/>
    <rect x="720" y="650" width="240" height="4"/>
  </g>

  <!-- finish structure -->
  <g>
    <rect x="1344" y="240" width="20" height="560" fill="#241b14"/>
    <rect x="1556" y="252" width="20" height="580" fill="#241b14"/>
    <rect x="1320" y="216" width="270" height="30" fill="#1c1511"/>
    <rect x="1320" y="216" width="270" height="7" fill="url(#trkRail)" opacity="0.8"/>
  </g>
  <g transform="rotate(-4.4 1450 520)">
    <rect x="1408" y="236" width="34" height="566" fill="url(#trkChecker)"/>
  </g>

  <!-- checkered floor shadow -->
  <path d="M 0 812 L 1600 900 L 0 900 Z" fill="#0b0908" opacity="0.7"/>
</svg>
