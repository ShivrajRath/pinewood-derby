<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="A hand sanding a shaped pine derby car body with a sanding block">
  <defs>
    <linearGradient id="sandBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6cea9"/>
      <stop offset="1" stop-color="#cfae82"/>
    </linearGradient>
    <linearGradient id="sandPine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecc58a"/>
      <stop offset="0.55" stop-color="#d9a660"/>
      <stop offset="1" stop-color="#b87f3d"/>
    </linearGradient>
    <linearGradient id="sandHand" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#f2c69f"/>
      <stop offset="1" stop-color="#d69b6f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sandBg)"/>
  <g stroke="#b4916a" stroke-width="2" opacity="0.35" fill="none">
    <path d="M 0 130 C 240 122 440 138 660 130 C 880 122 1050 136 1200 128"/>
    <path d="M 0 760 C 220 752 420 768 640 760 C 860 752 1040 766 1200 758"/>
    <path d="M 0 868 C 220 860 420 876 640 868 C 860 860 1040 874 1200 866"/>
  </g>

  <ellipse cx="606" cy="706" rx="368" ry="36" fill="#b08a5e" opacity="0.4"/>

  <!-- car body with wheel wells -->
  <g>
    <path d="M 258 700 L 258 636 C 270 574 322 542 396 532 L 702 486 C 766 478 810 490 842 522 L 912 600 C 938 630 950 666 952 700 Z"
      fill="url(#sandPine)" stroke="#8a5a2b" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 276 630 C 294 578 340 552 400 542 L 700 496 C 754 488 794 498 822 524" fill="none" stroke="#f8e4bd" stroke-width="8" opacity="0.55"/>
    <g stroke="#a86f36" stroke-width="2.4" fill="none" opacity="0.4">
      <path d="M 296 594 C 420 566 560 536 700 512"/>
      <path d="M 300 644 C 432 620 574 592 724 566"/>
      <path d="M 306 686 C 446 666 596 640 766 610"/>
    </g>
    <!-- fender crease and nose shading -->
    <path d="M 258 668 C 360 652 706 594 944 654" fill="none" stroke="#9b5e2d" stroke-width="3" opacity="0.45"/>
    <path d="M 952 700 C 948 666 936 632 912 604" fill="none" stroke="#8a5a2b" stroke-width="12" opacity="0.25"/>
    <!-- wheel wells cut into the base -->
    <circle cx="356" cy="700" r="58" fill="#e2c9a3"/>
    <circle cx="356" cy="700" r="58" fill="none" stroke="#8a5a2b" stroke-width="4"/>
    <circle cx="838" cy="700" r="58" fill="#e2c9a3"/>
    <circle cx="838" cy="700" r="58" fill="none" stroke="#8a5a2b" stroke-width="4"/>
    <!-- sanding marks -->
    <g stroke="#c9974f" stroke-width="2" opacity="0.55">
      <path d="M 420 566 L 476 558"/>
      <path d="M 452 600 L 516 590"/>
      <path d="M 500 550 L 558 542"/>
      <path d="M 610 528 L 668 520"/>
      <path d="M 690 580 L 752 572"/>
    </g>
  </g>

  <!-- sanding block with fingers wrapped over it -->
  <g transform="translate(566 408) rotate(-13)">
    <!-- sandpaper block -->
    <rect x="0" y="0" width="268" height="94" rx="9" fill="#c9974f" stroke="#6f4c25" stroke-width="3"/>
    <rect x="0" y="0" width="268" height="20" rx="9" fill="#f3e7d2" stroke="#c2a273" stroke-width="2"/>
    <g fill="#5d421f" opacity="0.45">
      <circle cx="38" cy="52" r="2.4"/><circle cx="76" cy="70" r="2"/><circle cx="118" cy="48" r="2.6"/>
      <circle cx="160" cy="72" r="2.2"/><circle cx="202" cy="52" r="2.4"/><circle cx="240" cy="68" r="2"/>
    </g>

    <!-- palm over the top of the block -->
    <path d="M -6 -78 C 4 -118 44 -136 92 -130 C 128 -150 172 -142 182 -112 L 200 -86 C 214 -58 200 -30 168 -22 L 22 -6 C -12 -2 -20 -44 -6 -78 Z"
      fill="url(#sandHand)" stroke="#bf875c" stroke-width="3"/>
    <!-- forearm -->
    <path d="M 156 -132 C 196 -166 250 -156 274 -120 L 262 -34 C 226 -14 176 -24 150 -52 Z" fill="url(#sandHand)" stroke="#bf875c" stroke-width="3"/>
    <!-- fingers curling over the near edge -->
    <g fill="url(#sandHand)" stroke="#bf875c" stroke-width="3">
      <rect x="6" y="46" width="196" height="34" rx="17"/>
      <rect x="14" y="76" width="180" height="32" rx="16"/>
      <rect x="26" y="104" width="152" height="28" rx="14"/>
    </g>
    <g stroke="#bf875c" stroke-width="2.4" fill="none" opacity="0.75">
      <path d="M 74 50 C 78 64 78 72 74 80"/>
      <path d="M 124 48 C 128 64 128 74 124 84"/>
      <path d="M 172 50 C 176 62 176 70 172 78"/>
      <path d="M 84 108 C 88 120 88 126 84 132"/>
      <path d="M 136 110 C 140 120 140 126 136 132"/>
    </g>
    <!-- thumb -->
    <path d="M -12 -34 C -44 -26 -52 2 -34 20 C -18 36 8 28 14 8 L 20 -18 Z" fill="url(#sandHand)" stroke="#bf875c" stroke-width="3"/>
    <!-- cuff -->
    <path d="M 258 -126 C 286 -140 318 -128 324 -104 L 300 -34 C 282 -24 262 -32 256 -52 Z" fill="#26382c"/>
    <path d="M 268 -114 C 286 -122 306 -116 312 -100" fill="none" stroke="#3c5244" stroke-width="3"/>
  </g>

  <!-- motion arrows -->
  <g>
    <path d="M 356 452 C 300 414 286 352 310 302" fill="none" stroke="#8a5a2b" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
    <path d="M 310 302 L 288 344 L 332 336 Z" fill="#8a5a2b" opacity="0.7"/>
    <path d="M 900 486 C 952 452 972 394 956 344" fill="none" stroke="#8a5a2b" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
    <path d="M 956 344 L 978 388 L 934 378 Z" fill="#8a5a2b" opacity="0.7"/>
  </g>

  <!-- dust -->
  <g fill="#f8e8cc">
    <circle cx="452" cy="470" r="4"/><circle cx="422" cy="512" r="3"/><circle cx="888" cy="536" r="4"/>
    <circle cx="920" cy="500" r="3"/><circle cx="396" cy="426" r="2.6"/><circle cx="856" cy="592" r="3"/>
    <circle cx="944" cy="574" r="2.6"/><circle cx="492" cy="444" r="2.2"/>
  </g>
  <g fill="#b98a4c" opacity="0.75">
    <circle cx="332" cy="664" r="3"/><circle cx="300" cy="690" r="2.2"/><circle cx="884" cy="668" r="3"/>
    <circle cx="922" cy="694" r="2.2"/>
  </g>
</svg>
