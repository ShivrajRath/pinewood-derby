<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="A coping saw cutting the traced profile out of a clamped pine block on a workbench">
  <defs>
    <linearGradient id="cutBench" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3c9a2"/>
      <stop offset="1" stop-color="#cba97d"/>
    </linearGradient>
    <linearGradient id="cutPine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6bb7e"/>
      <stop offset="1" stop-color="#c1843f"/>
    </linearGradient>
    <linearGradient id="cutSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e777e"/>
      <stop offset="0.5" stop-color="#b7c0c6"/>
      <stop offset="1" stop-color="#616a70"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#cutBench)"/>
  <g stroke="#b4916a" stroke-width="2" opacity="0.65">
    <path d="M 0 150 H 1200"/>
    <path d="M 0 330 H 1200"/>
    <path d="M 0 510 H 1200"/>
    <path d="M 0 690 H 1200"/>
    <path d="M 0 870 H 1200"/>
  </g>
  <g stroke="#b4916a" stroke-width="2" opacity="0.3" fill="none">
    <path d="M 0 96 C 220 88 420 104 640 96 C 860 88 1040 102 1200 94"/>
    <path d="M 0 590 C 180 582 380 598 600 590 C 840 582 1020 596 1200 588"/>
    <path d="M 0 800 C 200 792 400 808 620 800 C 840 792 1020 806 1200 798"/>
  </g>

  <ellipse cx="590" cy="806" rx="380" ry="34" fill="#a8835a" opacity="0.4"/>

  <!-- clamps -->
  <g fill="#545b61" stroke="#3c4348" stroke-width="3">
    <rect x="238" y="500" width="24" height="300" rx="6"/>
    <rect x="214" y="496" width="72" height="40" rx="8"/>
    <rect x="296" y="676" width="86" height="20" rx="8"/>
    <rect x="856" y="500" width="24" height="300" rx="6"/>
    <rect x="832" y="496" width="72" height="40" rx="8"/>
    <rect x="748" y="676" width="86" height="20" rx="8"/>
  </g>

  <!-- pine block, isometric -->
  <g>
    <polygon points="248,562 830,562 886,500 306,500" fill="#edc78f" stroke="#9b5e2d" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="830,562 886,500 886,740 830,802" fill="#b8763a" stroke="#9b5e2d" stroke-width="3" stroke-linejoin="round"/>
    <rect x="248" y="562" width="582" height="240" fill="url(#cutPine)" stroke="#8a5a2b" stroke-width="3"/>
    <g stroke="#a86f36" stroke-width="2.5" fill="none" opacity="0.5">
      <path d="M 248 608 C 380 600 480 614 600 606 C 700 600 780 610 830 604"/>
      <path d="M 248 666 C 390 658 500 672 620 664 C 720 658 790 668 830 662"/>
      <path d="M 248 726 C 380 718 490 732 610 724 C 710 718 790 728 830 722"/>
    </g>
    <g stroke="#e0b079" stroke-width="2" fill="none" opacity="0.5">
      <path d="M 316 508 C 470 500 700 504 870 508"/>
      <path d="M 330 540 C 480 534 700 538 868 542"/>
    </g>

    <!-- kerf -->
    <path d="M 636 562 L 692 500" stroke="#4a3423" stroke-width="8" stroke-linecap="round"/>
    <path d="M 636 562 V 802" stroke="#4a3423" stroke-width="8" fill="none"/>
    <path d="M 632 570 V 700" stroke="#f6e6c9" stroke-width="2" opacity="0.5"/>

    <!-- traced profile on the front face -->
    <path d="M 300 782 L 300 706 C 306 674 330 656 368 652 L 512 634 C 552 630 576 646 588 672 L 614 782 Z"
      fill="none" stroke="#3c3028" stroke-width="4" stroke-dasharray="15 10" stroke-linejoin="round" opacity="0.9"/>
    <circle cx="352" cy="782" r="24" fill="none" stroke="#3c3028" stroke-width="3" stroke-dasharray="10 8" opacity="0.7"/>
    <circle cx="572" cy="782" r="24" fill="none" stroke="#3c3028" stroke-width="3" stroke-dasharray="10 8" opacity="0.7"/>
  </g>

  <!-- sawdust -->
  <g fill="#e9b45f">
    <circle cx="640" cy="612" r="4.5"/>
    <circle cx="664" cy="588" r="3.4"/>
    <circle cx="616" cy="600" r="3.6"/>
    <circle cx="690" cy="624" r="3"/>
    <circle cx="600" cy="640" r="2.6"/>
    <circle cx="712" cy="600" r="2.4"/>
  </g>
  <g fill="#b98a4c">
    <circle cx="650" cy="654" r="2.2"/>
    <circle cx="586" cy="612" r="2.4"/>
    <circle cx="676" cy="668" r="2"/>
  </g>

  <!-- coping saw -->
  <g>
    <path d="M 470 452 C 428 408 422 330 456 268 C 500 188 636 166 714 234 C 778 294 772 428 718 512 C 702 534 684 546 664 550"
      fill="none" stroke="#4c545a" stroke-width="16" stroke-linecap="round"/>
    <path d="M 466 442 C 430 402 424 330 456 272 C 498 198 630 178 706 240" fill="none" stroke="#b6c0c6" stroke-width="4" opacity="0.4"/>
    <!-- tension wing nut -->
    <g transform="translate(660 196)">
      <rect x="-5" y="-16" width="10" height="32" rx="4" fill="#8d979f" stroke="#5b646a" stroke-width="2"/>
      <path d="M -26 0 C -26 -14 -10 -18 0 -18 C 12 -18 26 -12 26 0 C 26 12 12 18 0 18 C -10 18 -26 14 -26 0 Z" fill="#aab4bb" stroke="#5b646a" stroke-width="2"/>
    </g>

    <!-- blade -->
    <path d="M 470 452 L 664 550" stroke="url(#cutSteel)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 474 458 L 668 556" stroke="#5c666d" stroke-width="7" stroke-dasharray="3 6" opacity="0.9"/>
    <path d="M 472 448 L 666 546" stroke="#ffffff" stroke-width="2" opacity="0.5"/>

    <!-- blade clamps -->
    <circle cx="470" cy="452" r="9" fill="#8d979f" stroke="#5b646a" stroke-width="2.5"/>
    <circle cx="664" cy="550" r="9" fill="#8d979f" stroke="#5b646a" stroke-width="2.5"/>

    <!-- handle, in line with the blade -->
    <g transform="translate(664 550) rotate(17.4)">
      <rect x="2" y="-16" width="26" height="32" rx="4" fill="#b9c1c7" stroke="#78838a" stroke-width="2"/>
      <path d="M 28 -30 C 74 -38 122 -34 148 -18 C 164 -8 166 8 150 18 C 124 34 74 38 28 30 Z"
        fill="#96602f" stroke="#6c411c" stroke-width="3"/>
      <g stroke="#6c411c" stroke-width="3" opacity="0.55">
        <path d="M 58 -30 C 62 -12 62 12 58 30"/>
        <path d="M 84 -32 C 88 -12 88 12 84 32"/>
        <path d="M 110 -31 C 114 -12 114 12 110 31"/>
      </g>
      <path d="M 40 -22 C 74 -28 118 -24 140 -12" fill="none" stroke="#c08a52" stroke-width="4" opacity="0.5"/>
    </g>
  </g>
</svg>
