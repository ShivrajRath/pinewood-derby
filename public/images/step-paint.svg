<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="A spray can misting light coats onto a masked derby car body on a paint stand">
  <defs>
    <linearGradient id="paintBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#332a24"/>
      <stop offset="0.6" stop-color="#211a16"/>
      <stop offset="1" stop-color="#12100e"/>
    </linearGradient>
    <radialGradient id="paintLight" cx="0.6" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#e9b45f" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#12100e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paintCar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8483c"/>
      <stop offset="0.45" stop-color="#bf2118"/>
      <stop offset="1" stop-color="#760d07"/>
    </linearGradient>
    <linearGradient id="paintCan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfc4b3"/>
      <stop offset="0.28" stop-color="#f6efe2"/>
      <stop offset="0.62" stop-color="#e2d6c4"/>
      <stop offset="1" stop-color="#a99c89"/>
    </linearGradient>
    <linearGradient id="paintWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9723f"/>
      <stop offset="1" stop-color="#6c4623"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#paintBg)"/>
  <ellipse cx="720" cy="390" rx="520" ry="360" fill="url(#paintLight)"/>
  <g stroke="#f7f1e6" stroke-width="2" opacity="0.055" fill="none">
    <path d="M 60 130 H 1140"/>
    <path d="M 60 210 H 1140"/>
    <path d="M 60 290 H 1140"/>
    <path d="M 60 370 H 1140"/>
  </g>

  <!-- overspray haze -->
  <g fill="#e9b45f">
    <ellipse cx="470" cy="430" rx="150" ry="110" opacity="0.1"/>
    <ellipse cx="580" cy="470" rx="130" ry="90" opacity="0.09"/>
    <ellipse cx="690" cy="500" rx="110" ry="72" opacity="0.07"/>
  </g>
  <g fill="#f7f1e6">
    <circle cx="372" cy="330" r="3" opacity="0.4"/>
    <circle cx="424" cy="378" r="2.4" opacity="0.35"/>
    <circle cx="500" cy="352" r="3" opacity="0.3"/>
    <circle cx="556" cy="408" r="2.6" opacity="0.3"/>
    <circle cx="640" cy="372" r="2.2" opacity="0.25"/>
    <circle cx="330" cy="452" r="2.6" opacity="0.3"/>
    <circle cx="392" cy="500" r="2.2" opacity="0.25"/>
    <circle cx="700" cy="430" r="2" opacity="0.22"/>
  </g>

  <!-- mist cone -->
  <g opacity="0.5">
    <path d="M 330 268 L 566 352 L 520 560 L 322 340 Z" fill="#f7f1e6" opacity="0.1"/>
    <path d="M 332 286 L 606 404 L 560 552 L 324 322 Z" fill="#e9b45f" opacity="0.1"/>
  </g>

  <!-- stand -->
  <g>
    <ellipse cx="626" cy="812" rx="200" ry="30" fill="#000000" opacity="0.45"/>
    <ellipse cx="626" cy="790" rx="186" ry="34" fill="url(#paintWood)"/>
    <ellipse cx="626" cy="778" rx="186" ry="30" fill="#c08a52"/>
    <ellipse cx="626" cy="778" rx="186" ry="30" fill="none" stroke="#7c5129" stroke-width="3"/>
    <rect x="614" y="596" width="26" height="188" fill="#8a5a2b"/>
    <rect x="614" y="596" width="9" height="188" fill="#c08a52"/>
    <rect x="598" y="586" width="58" height="20" rx="6" fill="#6c4623"/>
  </g>

  <!-- car body -->
  <g>
    <path d="M 316 606 L 316 546 C 328 496 372 470 434 462 L 706 424 C 760 416 796 426 824 452 L 886 532 C 910 560 920 586 922 606 Z"
      fill="url(#paintCar)" stroke="#5c0a05" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 336 534 C 356 494 394 476 438 470 L 704 434 C 748 428 780 436 804 456" fill="none" stroke="#ffb9a8" stroke-width="9" opacity="0.28"/>
    <path d="M 324 566 L 918 590" stroke="#f7f1e6" stroke-width="8" opacity="0.85"/>
    <path d="M 324 580 L 918 604" stroke="#e9b45f" stroke-width="4" opacity="0.7"/>
    <!-- masking tape over the axle slots -->
    <g fill="#efe1c8" stroke="#cbb894" stroke-width="2" opacity="0.95">
      <rect x="352" y="566" width="70" height="40" rx="3" transform="rotate(2 352 566)"/>
      <rect x="806" y="588" width="72" height="24" rx="3" transform="rotate(2 806 588)"/>
    </g>
    <!-- wet gloss -->
    <path d="M 400 500 C 500 480 620 462 720 452" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.3"/>
    <!-- tide line highlight -->
    <path d="M 340 592 C 480 606 700 622 900 630" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.18"/>
  </g>

  <!-- spray can -->
  <g transform="translate(196 178) rotate(-14)">
    <rect x="0" y="86" width="152" height="262" rx="12" fill="url(#paintCan)" stroke="#8d8172" stroke-width="3"/>
    <path d="M 12 92 C 14 62 40 44 76 44 C 112 44 138 62 140 92 Z" fill="#ded1bd" stroke="#8d8172" stroke-width="3"/>
    <rect x="54" y="18" width="44" height="42" rx="7" fill="#1b1a19"/>
    <rect x="92" y="28" width="30" height="16" rx="6" fill="#2c2b29"/>
    <rect x="0" y="196" width="152" height="58" fill="#a5160f"/>
    <rect x="0" y="206" width="152" height="7" fill="#f7f1e6" opacity="0.85"/>
    <rect x="18" y="100" width="14" height="228" rx="7" fill="#ffffff" opacity="0.4"/>
    <g fill="#2a2724" opacity="0.75">
      <circle cx="96" cy="160" r="4"/>
      <circle cx="118" cy="160" r="4"/>
      <circle cx="140" cy="160" r="4"/>
    </g>
  </g>
  <g fill="#f7f1e6" opacity="0.6">
    <circle cx="322" cy="262" r="4"/>
    <circle cx="340" cy="240" r="2.6"/>
    <circle cx="300" cy="286" r="2.4"/>
  </g>
</svg>
