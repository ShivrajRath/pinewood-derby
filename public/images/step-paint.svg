<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="A spray can misting light coats onto a masked derby car body on a paint stand">
  <defs>
    <linearGradient id="paintBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#332a24"/>
      <stop offset="0.6" stop-color="#211a16"/>
      <stop offset="1" stop-color="#12100e"/>
    </linearGradient>
    <radialGradient id="paintLight" cx="0.6" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#e9b45f" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#12100e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paintCar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8483c"/>
      <stop offset="0.45" stop-color="#bf2118"/>
      <stop offset="1" stop-color="#760d07"/>
    </linearGradient>
    <linearGradient id="paintCan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9ad9b"/>
      <stop offset="0.3" stop-color="#f7f1e6"/>
      <stop offset="0.66" stop-color="#ded2c0"/>
      <stop offset="1" stop-color="#a1957f"/>
    </linearGradient>
    <linearGradient id="paintWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9723f"/>
      <stop offset="1" stop-color="#6c4623"/>
    </linearGradient>
    <linearGradient id="mistFade" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#f7f1e6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#f7f1e6" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#paintBg)"/>
  <ellipse cx="720" cy="400" rx="510" ry="360" fill="url(#paintLight)"/>
  <g stroke="#f7f1e6" stroke-width="2" opacity="0.05" fill="none">
    <path d="M 60 130 H 1140"/>
    <path d="M 60 210 H 1140"/>
    <path d="M 60 290 H 1140"/>
    <path d="M 60 370 H 1140"/>
  </g>

  <!-- stand -->
  <g>
    <ellipse cx="650" cy="818" rx="196" ry="28" fill="#000000" opacity="0.45"/>
    <ellipse cx="650" cy="792" rx="184" ry="34" fill="url(#paintWood)"/>
    <ellipse cx="650" cy="780" rx="184" ry="30" fill="#c08a52"/>
    <ellipse cx="650" cy="780" rx="184" ry="30" fill="none" stroke="#7c5129" stroke-width="3"/>
    <rect x="638" y="600" width="26" height="188" fill="#8a5a2b"/>
    <rect x="638" y="600" width="9" height="188" fill="#c08a52"/>
    <rect x="622" y="588" width="58" height="20" rx="6" fill="#6c4623"/>
  </g>

  <!-- car body, masked at the axle slots -->
  <g>
    <path d="M 330 606 L 330 542 C 342 492 386 466 448 458 L 720 420 C 774 412 810 422 838 448 L 900 528 C 924 556 934 582 936 606 Z"
      fill="url(#paintCar)" stroke="#5c0a05" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 350 530 C 370 490 408 472 452 466 L 718 430 C 762 424 794 432 818 452" fill="none" stroke="#ffb9a8" stroke-width="9" opacity="0.26"/>
    <path d="M 338 562 L 932 590" stroke="#f7f1e6" stroke-width="8" opacity="0.85"/>
    <path d="M 338 578 L 932 606" stroke="#e9b45f" stroke-width="4" opacity="0.7"/>
    <path d="M 414 496 C 514 476 634 458 734 448" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.28"/>
    <path d="M 354 588 C 494 602 714 620 916 628" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.16"/>

    <!-- masking tape strips over rear and front axle slots -->
    <g fill="#efe1c8" stroke="#c9b48e" stroke-width="2">
      <path d="M 380 516 L 440 512 L 446 620 L 386 624 Z" opacity="0.95"/>
      <path d="M 824 548 L 876 552 L 872 620 L 820 616 Z" opacity="0.95"/>
    </g>
    <g stroke="#d9c9ab" stroke-width="2" opacity="0.8">
      <path d="M 386 528 L 440 524"/>
      <path d="M 830 560 L 874 563"/>
    </g>
  </g>

  <!-- mist from the nozzle to the body -->
  <g>
    <path d="M 344 250 L 700 420 L 620 592 L 336 292 Z" fill="url(#mistFade)"/>
    <path d="M 348 232 L 780 400 L 690 566 L 340 276 Z" fill="#e9b45f" opacity="0.08"/>
    <g fill="#f7f1e6">
      <circle cx="404" cy="292" r="3.4" opacity="0.5"/>
      <circle cx="468" cy="330" r="2.8" opacity="0.45"/>
      <circle cx="540" cy="360" r="3.2" opacity="0.4"/>
      <circle cx="612" cy="396" r="2.6" opacity="0.35"/>
      <circle cx="680" cy="430" r="3" opacity="0.3"/>
      <circle cx="436" cy="368" r="2.4" opacity="0.4"/>
      <circle cx="516" cy="420" r="2.8" opacity="0.35"/>
      <circle cx="596" cy="460" r="2.2" opacity="0.3"/>
      <circle cx="392" cy="340" r="2" opacity="0.35"/>
      <circle cx="660" cy="500" r="2.4" opacity="0.25"/>
    </g>
    <g fill="#ffffff" opacity="0.12">
      <ellipse cx="520" cy="392" rx="110" ry="52" transform="rotate(18 520 392)"/>
      <ellipse cx="626" cy="440" rx="86" ry="40" transform="rotate(18 626 440)"/>
    </g>
  </g>

  <!-- spray can, aimed at the body -->
  <g transform="translate(270 140) rotate(33)">
    <rect x="0" y="86" width="150" height="256" rx="12" fill="url(#paintCan)" stroke="#8d8172" stroke-width="3"/>
    <path d="M 12 92 C 14 62 40 44 75 44 C 110 44 136 62 138 92 Z" fill="#ded1bd" stroke="#8d8172" stroke-width="3"/>
    <rect x="52" y="18" width="46" height="42" rx="7" fill="#1b1a19"/>
    <rect x="90" y="26" width="34" height="16" rx="6" fill="#2c2b29"/>
    <rect x="0" y="192" width="150" height="56" fill="#a5160f"/>
    <rect x="0" y="202" width="150" height="7" fill="#f7f1e6" opacity="0.85"/>
    <rect x="16" y="100" width="14" height="240" rx="7" fill="#ffffff" opacity="0.42"/>
    <g fill="#2a2724" opacity="0.7">
      <circle cx="94" cy="158" r="4"/>
      <circle cx="116" cy="158" r="4"/>
      <circle cx="138" cy="158" r="4"/>
    </g>
  </g>
  <g fill="#f7f1e6">
    <circle cx="368" cy="246" r="3.6" opacity="0.5"/>
    <circle cx="384" cy="226" r="2.4" opacity="0.4"/>
    <circle cx="352" cy="212" r="2.2" opacity="0.35"/>
  </g>
</svg>
