<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="A red pinewood derby car racing down a wooden track toward a checkered finish line">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0a09"/>
      <stop offset="0.55" stop-color="#1a1411"/>
      <stop offset="1" stop-color="#2b1c13"/>
    </linearGradient>
    <radialGradient id="heroGlow" cx="0.66" cy="0.38" r="0.52">
      <stop offset="0" stop-color="#e9b45f" stop-opacity="0.3"/>
      <stop offset="0.5" stop-color="#a5160f" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#131010" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heroTrack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d6440"/>
      <stop offset="0.35" stop-color="#5f4229"/>
      <stop offset="1" stop-color="#231710"/>
    </linearGradient>
    <linearGradient id="heroCar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef5a48"/>
      <stop offset="0.45" stop-color="#c0231a"/>
      <stop offset="1" stop-color="#7c0d07"/>
    </linearGradient>
    <linearGradient id="heroGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3a31"/>
      <stop offset="1" stop-color="#170f0c"/>
    </linearGradient>
    <linearGradient id="heroGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4d193"/>
      <stop offset="1" stop-color="#c08a35"/>
    </linearGradient>
    <pattern id="checkerFinish" width="44" height="44" patternUnits="userSpaceOnUse">
      <rect width="44" height="44" fill="#f7f1e6"/>
      <rect width="22" height="22" fill="#131010"/>
      <rect x="22" y="22" width="22" height="22" fill="#131010"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#heroBg)"/>
  <circle cx="1060" cy="400" r="470" fill="url(#heroGlow)"/>
  <circle cx="1060" cy="400" r="330" fill="none" stroke="#e9b45f" stroke-width="2" opacity="0.14"/>

  <g stroke="#f7f1e6" stroke-width="2" opacity="0.06" fill="none">
    <path d="M 120 250 H 620"/>
    <path d="M 60 320 H 520"/>
    <path d="M 150 390 H 560"/>
    <path d="M 90 460 H 400"/>
    <path d="M 30 530 H 350"/>
    <path d="M 110 600 H 430"/>
    <path d="M 60 670 H 300"/>
  </g>

  <!-- track deck -->
  <path d="M 0 726 L 1600 646 L 1600 1000 L 0 1000 Z" fill="url(#heroTrack)"/>
  <path d="M 0 726 L 1600 646" stroke="#c9a273" stroke-width="4" opacity="0.5" fill="none"/>
  <g stroke="#1a110c" stroke-width="2.5" opacity="0.5">
    <path d="M 0 806 L 1600 722"/>
    <path d="M 0 890 L 1600 800"/>
    <path d="M 0 966 L 1600 872"/>
  </g>
  <g stroke="#a67c50" stroke-width="2" opacity="0.25">
    <path d="M 210 726 L 210 1000"/>
    <path d="M 520 716 L 520 1000"/>
    <path d="M 830 706 L 830 1000"/>
    <path d="M 1140 696 L 1140 1000"/>
    <path d="M 1450 686 L 1450 1000"/>
  </g>
  <!-- lane guide rail -->
  <path d="M 0 746 L 1600 666" stroke="#241812" stroke-width="20" opacity="0.85"/>
  <path d="M 0 741 L 1600 661" stroke="url(#heroGold)" stroke-width="3" opacity="0.4"/>

  <!-- finish gantry -->
  <g>
    <rect x="1394" y="270" width="18" height="410" fill="#2a211b"/>
    <rect x="1560" y="258" width="18" height="404" fill="#2a211b"/>
    <rect x="1372" y="224" width="216" height="30" fill="#1d1713"/>
    <rect x="1372" y="224" width="216" height="8" fill="url(#heroGold)" opacity="0.8"/>
  </g>
  <g transform="rotate(-2.4 1470 460)">
    <rect x="1452" y="262" width="44" height="400" fill="url(#checkerFinish)"/>
  </g>

  <!-- car, nose to the right -->
  <g transform="translate(740 593)">
    <!-- speed streaks -->
    <g fill="#f7f1e6">
      <path d="M -520 12 L -150 26 L -150 32 L -520 22 Z" opacity="0.12"/>
      <path d="M -430 -38 L -140 -26 L -140 -20 L -430 -28 Z" opacity="0.1"/>
      <path d="M -470 58 L -120 68 L -120 74 L -470 66 Z" opacity="0.09"/>
    </g>
    <g fill="#e9b45f">
      <path d="M -390 36 L -170 44 L -170 48 L -390 42 Z" opacity="0.22"/>
    </g>

    <!-- shadow on the track -->
    <ellipse cx="330" cy="104" rx="400" ry="20" fill="#0b0807" opacity="0.6"/>

    <!-- wing, attached with struts -->
    <rect x="-16" y="-156" width="190" height="20" rx="4" fill="#a5160f"/>
    <rect x="-16" y="-156" width="190" height="4" rx="2" fill="#e8483c" opacity="0.7"/>
    <path d="M 18 -140 L 44 -140 L 38 -34 L 12 -34 Z" fill="#5d0b06"/>
    <path d="M 120 -140 L 146 -140 L 140 -34 L 114 -34 Z" fill="#5d0b06"/>

    <!-- body -->
    <path d="M 18 96 L 18 6 C 34 -22 72 -36 120 -40 L 384 -30 C 452 -24 512 2 552 44 C 580 74 592 88 596 96 Z"
      fill="url(#heroCar)" stroke="#5c0a05" stroke-width="3" stroke-linejoin="round"/>
    <!-- canopy -->
    <path d="M 300 -34 C 330 -52 386 -50 414 -30 L 400 -22 C 372 -36 332 -38 308 -24 Z" fill="url(#heroGlass)"/>
    <path d="M 316 -36 C 340 -46 380 -44 400 -32" fill="none" stroke="#f7f1e6" stroke-width="3" opacity="0.35"/>
    <!-- stripes -->
    <path d="M 26 36 L 574 62" stroke="#f7f1e6" stroke-width="9" opacity="0.8"/>
    <path d="M 26 54 L 578 80" stroke="#e9b45f" stroke-width="4" opacity="0.65"/>
    <!-- number -->
    <text x="176" y="26" font-family="Anton, Impact, Arial Narrow, sans-serif" font-size="74" fill="#f7f1e6" opacity="0.94">84</text>
    <!-- top gloss -->
    <path d="M 92 -30 C 200 -44 320 -38 396 -30" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.22"/>
    <!-- nose shading -->
    <path d="M 596 96 C 592 70 572 44 544 26" fill="none" stroke="#4d0803" stroke-width="14" opacity="0.35"/>

    <!-- wheel arches and wheels -->
    <g>
      <circle cx="120" cy="96" r="58" fill="#4a0803"/>
      <circle cx="532" cy="96" r="58" fill="#4a0803"/>
      <circle cx="120" cy="96" r="46" fill="#161110"/>
      <circle cx="120" cy="96" r="30" fill="#2c2522"/>
      <circle cx="120" cy="96" r="12" fill="url(#heroGold)"/>
      <circle cx="532" cy="96" r="46" fill="#161110"/>
      <circle cx="532" cy="96" r="30" fill="#2c2522"/>
      <circle cx="532" cy="96" r="12" fill="url(#heroGold)"/>
      <path d="M 88 62 A 46 46 0 0 1 144 54" fill="none" stroke="#f7f1e6" stroke-width="3" opacity="0.2"/>
      <path d="M 500 62 A 46 46 0 0 1 556 54" fill="none" stroke="#f7f1e6" stroke-width="3" opacity="0.2"/>
    </g>
  </g>

  <!-- flag -->
  <g transform="translate(1262 316) rotate(-8)">
    <rect x="-4" y="-8" width="12" height="196" rx="5" fill="#cbb492"/>
    <path d="M 8 6 L 172 32 L 160 100 L 6 78 Z" fill="url(#checkerFinish)"/>
    <path d="M 8 6 L 172 32 L 160 100 L 6 78 Z" fill="#131010" opacity="0.1"/>
  </g>

  <g fill="#f7f1e6">
    <circle cx="340" cy="780" r="2.4" opacity="0.4"/>
    <circle cx="474" cy="842" r="2" opacity="0.3"/>
    <circle cx="1180" cy="762" r="2.4" opacity="0.35"/>
    <circle cx="900" cy="868" r="2" opacity="0.3"/>
  </g>
</svg>
