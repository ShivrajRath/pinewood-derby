<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="A red pinewood derby car racing down a wooden track toward a checkered finish line">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0a09"/>
      <stop offset="0.55" stop-color="#1a1411"/>
      <stop offset="1" stop-color="#2b1c13"/>
    </linearGradient>
    <radialGradient id="heroGlow" cx="0.66" cy="0.38" r="0.52">
      <stop offset="0" stop-color="#e9b45f" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#a5160f" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#131010" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heroTrack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d6440"/>
      <stop offset="0.35" stop-color="#5f4229"/>
      <stop offset="1" stop-color="#231710"/>
    </linearGradient>
    <linearGradient id="heroCar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef5a48"/>
      <stop offset="0.45" stop-color="#c0231a"/>
      <stop offset="1" stop-color="#7c0d07"/>
    </linearGradient>
    <linearGradient id="heroGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4d193"/>
      <stop offset="1" stop-color="#c08a35"/>
    </linearGradient>
    <pattern id="checkerFinish" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="#f7f1e6"/>
      <rect width="24" height="24" fill="#131010"/>
      <rect x="24" y="24" width="24" height="24" fill="#131010"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#heroBg)"/>
  <circle cx="1060" cy="400" r="470" fill="url(#heroGlow)"/>
  <circle cx="1060" cy="400" r="330" fill="none" stroke="#e9b45f" stroke-width="2" opacity="0.16"/>

  <g stroke="#f7f1e6" stroke-width="2" opacity="0.07" fill="none">
    <path d="M 120 250 H 620"/>
    <path d="M 60 320 H 520"/>
    <path d="M 150 390 H 560"/>
    <path d="M 90 460 H 400"/>
    <path d="M 30 530 H 350"/>
    <path d="M 110 600 H 430"/>
    <path d="M 60 670 H 300"/>
  </g>

  <!-- track deck -->
  <path d="M 0 726 L 1600 646 L 1600 1000 L 0 1000 Z" fill="url(#heroTrack)"/>
  <path d="M 0 726 L 1600 646" stroke="#c9a273" stroke-width="4" opacity="0.55" fill="none"/>
  <g stroke="#1a110c" stroke-width="2.5" opacity="0.5">
    <path d="M 0 806 L 1600 722"/>
    <path d="M 0 890 L 1600 800"/>
    <path d="M 0 966 L 1600 872"/>
  </g>
  <g fill="#1a110c" opacity="0.55">
    <rect x="0" y="700" width="1600" height="16"/>
  </g>
  <path d="M 0 700 L 1600 622" stroke="#e9b45f" stroke-width="3" opacity="0.35" fill="none"/>

  <!-- motion streaks -->
  <g fill="#f7f1e6" opacity="0.12">
    <rect x="360" y="586" width="360" height="6"/>
    <rect x="250" y="628" width="470" height="5"/>
    <rect x="420" y="668" width="300" height="5"/>
    <rect x="300" y="712" width="420" height="4"/>
  </g>
  <g fill="#e9b45f" opacity="0.28">
    <rect x="700" y="600" width="180" height="4"/>
    <rect x="660" y="646" width="230" height="3"/>
  </g>

  <!-- finish gantry -->
  <g>
    <rect x="1392" y="270" width="18" height="440" fill="#2a211b"/>
    <rect x="1560" y="256" width="18" height="440" fill="#2a211b"/>
    <rect x="1360" y="222" width="240" height="30" fill="#1d1713"/>
    <rect x="1360" y="222" width="240" height="8" fill="url(#heroGold)" opacity="0.8"/>
  </g>

  <g transform="translate(763 604)">
    <!-- rear wing -->
    <rect x="-6" y="-130" width="128" height="20" rx="4" fill="#8e1109"/>
    <rect x="10" y="-112" width="12" height="34" fill="#5d0b06"/>
    <rect x="92" y="-112" width="12" height="34" fill="#5d0b06"/>
    <!-- body -->
    <path d="M 20 96 L 20 16 C 28 -22 56 -44 104 -52 L 322 -108 C 362 -118 400 -112 432 -94 L 596 -8 C 628 8 646 36 650 72 L 650 96 Z" fill="url(#heroCar)"/>
    <path d="M 104 -52 L 322 -108 C 362 -118 400 -112 432 -94 L 470 -74 L 120 -22 Z" fill="#f7f1e6" opacity="0.16"/>
    <!-- stripe -->
    <path d="M 30 30 L 640 54" stroke="#f7f1e6" stroke-width="9" opacity="0.75"/>
    <path d="M 30 48 L 640 72" stroke="#e9b45f" stroke-width="4" opacity="0.6"/>
    <!-- number -->
    <text x="380" y="46" font-family="Anton, Impact, Arial Narrow, sans-serif" font-size="86" fill="#f7f1e6" opacity="0.92">84</text>
    <!-- gloss -->
    <path d="M 130 -34 C 230 -66 330 -84 420 -80" stroke="#ffffff" stroke-width="10" opacity="0.14" fill="none"/>
    <!-- wheels -->
    <g>
      <circle cx="130" cy="96" r="48" fill="#161110"/>
      <circle cx="130" cy="96" r="30" fill="#2c2522"/>
      <circle cx="130" cy="96" r="12" fill="url(#heroGold)"/>
      <circle cx="594" cy="92" r="48" fill="#161110"/>
      <circle cx="594" cy="92" r="30" fill="#2c2522"/>
      <circle cx="594" cy="92" r="12" fill="url(#heroGold)"/>
    </g>
    <path d="M 20 96 L 650 96" stroke="#000000" stroke-width="6" opacity="0.25"/>
  </g>

  <!-- finished checker strip -->
  <g transform="rotate(-2.2 1480 470)">
    <rect x="1468" y="270" width="26" height="432" fill="url(#checkerFinish)"/>
  </g>

  <!-- flag -->
  <g transform="translate(1268 320) rotate(-8)">
    <rect x="-4" y="-8" width="12" height="220" rx="5" fill="#cbb492"/>
    <path d="M 8 6 L 190 34 L 176 112 L 6 86 Z" fill="url(#checkerFinish)"/>
    <path d="M 8 6 L 190 34 L 176 112 L 6 86 Z" fill="#131010" opacity="0.12"/>
  </g>

  <g fill="#f7f1e6" opacity="0.5">
    <circle cx="340" cy="760" r="2.5"/>
    <circle cx="470" cy="812" r="2"/>
    <circle cx="1180" cy="742" r="2.5"/>
    <circle cx="900" cy="838" r="2"/>
  </g>
</svg>
